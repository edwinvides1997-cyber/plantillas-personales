<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Plantillas</title>

<script>
if(!localStorage.getItem("rol")){
  window.location.href="login.html";
}
if(localStorage.getItem("rol") === "admin"){
  window.location.href="privado.html";
}
</script>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
}

.container{
  padding:60px 20px;
}

h1{
  font-size:42px;
  margin-bottom:50px;
}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#ffffff;
  color:#333;
  padding:25px;
  border-radius:14px;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,0.3);
}

.logout{
  margin-top:60px;
  padding:10px 20px;
  border:none;
  background:white;
  color:#2c5364;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.logout:hover{
  background:#e0e0e0;
}
</style>
</head>

<body>

<div class="container">
  <h1>Panel de Plantillas</h1>

  <div class="grid">

    <div class="card">Crédito Directo</div>

    <div class="card">ICETEX</div>

    <div class="card">Convenios</div>

    <div class="card">Beca Académica de Honor</div>

    <div class="card">Generales</div>

  </div>

  <button class="logout" onclick="logout()">Cerrar sesión</button>
</div>

<script>
function logout(){
  localStorage.removeItem("rol");
  window.location.href="login.html";
}
</script>

</body>
</html>
