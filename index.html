<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Plantillas</title>

<script>
if(!localStorage.getItem("rol")){
  window.location.href="login.html";
}
if(localStorage.getItem("rol") === "admin"){
  window.location.href="privado.html";
}
</script>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
}

.container{
  padding:60px 20px;
}

h1{
  font-size:42px;
  margin-bottom:50px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  color:#333;
  padding:25px;
  border-radius:14px;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card:hover{
  transform:translateY(-5px);
}

.section-view{
  display:none;
  max-width:800px;
  margin:40px auto;
  background:white;
  color:#333;
  padding:30px;
  border-radius:15px;
  animation:fadeIn 0.3s ease;
}

.template-item{
  background:#f4f6f9;
  padding:18px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:left;
  position:relative;
}

.template-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.template-content{
  font-size:14px;
  color:#444;
}

.copy-btn{
  position:absolute;
  top:12px;
  right:12px;
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
}

.search-box{
  width:100%;
  padding:10px;
  margin-bottom:20px;
  border-radius:6px;
  border:1px solid #ccc;
}

.back-btn{
  margin-top:20px;
  padding:8px 15px;
  border:none;
  background:#2c5364;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.logout{
  margin-top:40px;
  padding:10px 20px;
  border:none;
  background:white;
  color:#2c5364;
  border-radius:8px;
  cursor:pointer;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container" id="mainMenu">
  <h1>Panel de Plantillas</h1>

  <div class="grid">
    <div class="card" onclick="openSection('credito')">Crédito Directo</div>
    <div class="card" onclick="openSection('icetex')">ICETEX</div>
    <div class="card" onclick="openSection('convenios')">Convenios</div>
    <div class="card" onclick="openSection('beca')">Beca Académica de Honor</div>
    <div class="card" onclick="openSection('generales')">Generales</div>
  </div>

  <button class="logout" onclick="logout()">Cerrar sesión</button>
</div>


<div id="sectionContainer" class="section-view">
  <h2 id="sectionTitle"></h2>

  <input type="text" class="search-box" placeholder="Buscar por título..." onkeyup="filterTemplates(this)">

  <div id="templatesArea"></div>

  <button class="back-btn" onclick="goBack()">Volver</button>
</div>


<script>

const templates = {
  credito: [
    {titulo:"Información Crédito Directo", contenido:"Puedes acceder a la modalidad de Crédito Directo bajo las condiciones establecidas."},
    {titulo:"Documentos Crédito Directo", contenido:"Adjunta los documentos solicitados para continuar con el proceso."}
  ],
  icetex: [
    {titulo:"Estado ICETEX", contenido:"Verifica el estado de tu proceso con ICETEX."}
  ],
  convenios: [
    {titulo:"Consulta Convenios", contenido:"Consulta los convenios vigentes disponibles."}
  ],
  beca: [
    {titulo:"Felicitación Beca", contenido:"Felicitaciones por tu excelente desempeño académico."}
  ],
  generales: [
    {titulo:"Solicitud Recibida", contenido:"Tu solicitud ha sido recibida y está en proceso de validación."}
  ]
};

let currentSection="";

function openSection(section){
  currentSection=section;
  document.getElementById("mainMenu").style.display="none";
  document.getElementById("sectionContainer").style.display="block";
  document.getElementById("sectionTitle").innerText = event.target.innerText;
  loadTemplates(section);
}

function loadTemplates(section){
  const area = document.getElementById("templatesArea");
  area.innerHTML = "";

  templates[section].forEach(obj=>{
    createTemplateItem(obj.titulo,obj.contenido,area);
  });

  const custom = JSON.parse(localStorage.getItem("custom_"+section)) || [];
  custom.forEach(obj=>{
    createTemplateItem(obj.titulo,obj.contenido,area);
  });
}

function createTemplateItem(titulo,contenido,area){
  const div=document.createElement("div");
  div.className="template-item";
  div.innerHTML=`
    <div class="template-title">${titulo}</div>
    <div class="template-content">${contenido}</div>
    <button class="copy-btn" onclick="copyText('${contenido.replace(/'/g,"\\'")}')">📋</button>
  `;
  area.appendChild(div);
}

function copyText(text){
  navigator.clipboard.writeText(text);
}

function filterTemplates(input){
  const value = input.value.toLowerCase();
  const items = document.querySelectorAll(".template-item");

  items.forEach(item=>{
    const title = item.querySelector(".template-title").innerText.toLowerCase();
    const content = item.querySelector(".template-content").innerText.toLowerCase();

    if(title.includes(value) || content.includes(value)){
      item.style.display="block";
    } else {
      item.style.display="none";
    }
  });
}

function goBack(){
  document.getElementById("sectionContainer").style.display="none";
  document.getElementById("mainMenu").style.display="block";
}

function logout(){
  localStorage.removeItem("rol");
  window.location.href="login.html";
}

</script>

</body>
</html>
