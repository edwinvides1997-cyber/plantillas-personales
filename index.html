<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plantillas</title>

<script>
if(!localStorage.getItem("rol")){
  window.location.href="login.html";
}
if(localStorage.getItem("rol") === "admin"){
  window.location.href="privado.html";
}
</script>

<style>
body{
  font-family:Arial;
  padding:40px;
}
button{
  margin-top:20px;
}
</style>
</head>

<body>

<h1>Plantillas</h1>
<p>Aquí están todas las plantillas disponibles.</p>

<button onclick="logout()">Cerrar sesión</button>

<script>
function logout(){
  localStorage.removeItem("rol");
  window.location.href="login.html";
}
</script>

</body>
</html>
