<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial;
  background:linear-gradient(to right,#e0eafc,#cfdef3);
}

.box{
  background:white;
  padding:30px;
  border-radius:12px;
  width:300px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  background:#2c3e50;
  color:white;
  border:none;
  cursor:pointer;
}

#error{
  color:red;
}
</style>
</head>

<body>

<div class="box">
  <h2>Acceso</h2>
  <input type="password" id="pass" placeholder="Ingresa la clave">
  <button onclick="login()">Entrar</button>
  <p id="error"></p>
</div>

<script>
function login(){
  const p = document.getElementById("pass").value;
  const error = document.getElementById("error");

  if(p === "1234"){
    localStorage.setItem("rol","usuario");
    window.location.href="index.html";
  }
  else if(p === "admin2025"){
    localStorage.setItem("rol","admin");
    window.location.href="privado.html";
  }
  else{
    error.textContent="Clave incorrecta";
  }
}
</script>

</body>
</html>
