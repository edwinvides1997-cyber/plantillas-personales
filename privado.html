<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>

<script>
if(localStorage.getItem("rol") !== "admin"){
  window.location.href="login.html";
}
</script>

<style>
body{
  font-family:'Segoe UI', sans-serif;
  background:#f4f6f9;
  padding:40px;
}

h1{
  text-align:center;
  margin-bottom:40px;
}

.section{
  margin-bottom:40px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, textarea, select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
}

.add-btn{ background:#2c5364; color:white; }
.edit-btn{ background:#ffc107; }
.delete-btn{ background:#dc3545; color:white; }

.template-item{
  background:#f8f9fa;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h1>Panel Administrador</h1>

<div class="section">
  <h3>Crear Nueva Plantilla</h3>

  <select id="sectionSelect">
    <option value="credito">Crédito Directo</option>
    <option value="icetex">ICETEX</option>
    <option value="convenios">Convenios</option>
    <option value="beca">Beca Académica</option>
    <option value="generales">Generales</option>
  </select>

  <input type="text" id="titulo" placeholder="Título">
  <textarea id="contenido" rows="4" placeholder="Contenido"></textarea>

  <button class="add-btn" onclick="addTemplate()">Agregar</button>
</div>

<div class="section">
  <h3>Plantillas Creadas</h3>
  <div id="templatesList"></div>
</div>

<script>

let editIndex=null;
let editSection=null;

function loadAllTemplates(){
  const list=document.getElementById("templatesList");
  list.innerHTML="";

  const sections=["credito","icetex","convenios","beca","generales"];

  sections.forEach(section=>{
    const custom=JSON.parse(localStorage.getItem("custom_"+section))||[];

    custom.forEach((obj,index)=>{
      const div=document.createElement("div");
      div.className="template-item";
      div.innerHTML=`
        <strong>${obj.titulo}</strong><br>
        ${obj.contenido}<br><br>
        <button class="edit-btn" onclick="editTemplate('${section}',${index})">✏️ Editar</button>
        <button class="delete-btn" onclick="deleteTemplate('${section}',${index})">🗑 Eliminar</button>
      `;
      list.appendChild(div);
    });
  });
}

function addTemplate(){
  const section=document.getElementById("sectionSelect").value;
  const titulo=document.getElementById("titulo").value;
  const contenido=document.getElementById("contenido").value;

  if(!titulo || !contenido) return alert("Completa todos los campos");

  let custom=JSON.parse(localStorage.getItem("custom_"+section))||[];

  if(editIndex!==null){
    custom[editIndex]={titulo,contenido};
    editIndex=null;
    editSection=null;
  }else{
    custom.push({titulo,contenido});
  }

  localStorage.setItem("custom_"+section,JSON.stringify(custom));

  document.getElementById("titulo").value="";
  document.getElementById("contenido").value="";

  loadAllTemplates();
}

function editTemplate(section,index){
  const custom=JSON.parse(localStorage.getItem("custom_"+section))||[];
  const obj=custom[index];

  document.getElementById("sectionSelect").value=section;
  document.getElementById("titulo").value=obj.titulo;
  document.getElementById("contenido").value=obj.contenido;

  editIndex=index;
  editSection=section;
}

function deleteTemplate(section,index){
  if(!confirm("¿Eliminar plantilla?")) return;

  let custom=JSON.parse(localStorage.getItem("custom_"+section))||[];
  custom.splice(index,1);
  localStorage.setItem("custom_"+section,JSON.stringify(custom));

  loadAllTemplates();
}

loadAllTemplates();

</script>

</body>
</html>
