<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Privado</title>

<script>
if(localStorage.getItem("rol") !== "admin"){
  window.location.href="login.html";
}
</script>

<style>
body{
  font-family:Arial;
  padding:40px;
  background:#f4f4f4;
}
</style>
</head>

<body>

<h1>Panel de Administración</h1>
<p>Aquí puedes editar y gestionar las plantillas.</p>

<button onclick="logout()">Cerrar sesión</button>

<script>
function logout(){
  localStorage.removeItem("rol");
  window.location.href="login.html";
}
</script>

</body>
</html>
