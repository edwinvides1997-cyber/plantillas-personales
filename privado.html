<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>

<script>
if(localStorage.getItem("rol") !== "admin"){
  window.location.href="login.html";
}
</script>

<style>
body{
  font-family:'Segoe UI', sans-serif;
  background:#f4f6f9;
  padding:40px;
}

h1{text-align:center;margin-bottom:30px;}

.section{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:30px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, textarea, select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
}

.add-btn{ background:#2c5364; color:white; }
.delete-btn{ background:#dc3545; color:white; }
.edit-btn{ background:#ffc107; }

.template-item{
  background:#f8f9fa;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h1>Panel Administrador</h1>

<div class="section">
  <h3>Crear Nueva Categoría</h3>
  <input type="text" id="newCategory" placeholder="Nombre de la categoría">
  <button class="add-btn" onclick="addCategory()">Agregar Categoría</button>
</div>

<div class="section">
  <h3>Crear Nueva Plantilla</h3>

  <select id="sectionSelect"></select>

  <input type="text" id="titulo" placeholder="Título">
  <textarea id="contenido" rows="4" placeholder="Contenido"></textarea>

  <button class="add-btn" onclick="addTemplate()">Guardar Plantilla</button>
</div>

<div class="section">
  <h3>Plantillas</h3>
  <div id="templatesList"></div>
</div>

<script>

let editIndex=null;
let editSection=null;

function getCategorias(){
  let categorias=JSON.parse(localStorage.getItem("categorias"));
  if(!categorias){
    categorias=["credito","icetex","convenios","beca","generales"];
    localStorage.setItem("categorias",JSON.stringify(categorias));
  }
  return categorias;
}

function loadCategorias(){
  const select=document.getElementById("sectionSelect");
  select.innerHTML="";
  const categorias=getCategorias();
  categorias.forEach(cat=>{
    const option=document.createElement("option");
    option.value=cat;
    option.textContent=cat;
    select.appendChild(option);
  });
}

function addCategory(){
  const name=document.getElementById("newCategory").value.trim();
  if(!name) return alert("Escribe un nombre válido");

  let categorias=getCategorias();
  categorias.push(name.toLowerCase());
  localStorage.setItem("categorias",JSON.stringify(categorias));

  document.getElementById("newCategory").value="";
  loadCategorias();
  alert("Categoría creada");
}

function addTemplate(){
  const section=document.getElementById("sectionSelect").value;
  const titulo=document.getElementById("titulo").value;
  const contenido=document.getElementById("contenido").value;

  if(!titulo||!contenido) return alert("Completa campos");

  let custom=JSON.parse(localStorage.getItem("custom_"+section))||[];

  if(editIndex!==null){
    custom[editIndex]={titulo,contenido};
    editIndex=null;
  }else{
    custom.push({titulo,contenido});
  }

  localStorage.setItem("custom_"+section,JSON.stringify(custom));

  document.getElementById("titulo").value="";
  document.getElementById("contenido").value="";

  loadTemplates();
}

function loadTemplates(){
  const list=document.getElementById("templatesList");
  list.innerHTML="";

  const categorias=getCategorias();

  categorias.forEach(section=>{
    const custom=JSON.parse(localStorage.getItem("custom_"+section))||[];

    custom.forEach((obj,index)=>{
      const div=document.createElement("div");
      div.className="template-item";
      div.innerHTML=`
        <strong>${section.toUpperCase()}</strong><br>
        <strong>${obj.titulo}</strong><br>
        ${obj.contenido}<br><br>
        <button class="edit-btn" onclick="editTemplate('${section}',${index})">✏️</button>
        <button class="delete-btn" onclick="deleteTemplate('${section}',${index})">🗑</button>
      `;
      list.appendChild(div);
    });
  });
}

function editTemplate(section,index){
  const custom=JSON.parse(localStorage.getItem("custom_"+section));
  const obj=custom[index];

  document.getElementById("sectionSelect").value=section;
  document.getElementById("titulo").value=obj.titulo;
  document.getElementById("contenido").value=obj.contenido;

  editIndex=index;
  editSection=section;
}

function deleteTemplate(section,index){
  if(!confirm("¿Eliminar plantilla?")) return;
  let custom=JSON.parse(localStorage.getItem("custom_"+section));
  custom.splice(index,1);
  localStorage.setItem("custom_"+section,JSON.stringify(custom));
  loadTemplates();
}

loadCategorias();
loadTemplates();

</script>

</body>
</html>
